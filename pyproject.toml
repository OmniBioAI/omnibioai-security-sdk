[build-system]
# setup.py imports Cython to compile selected modules, so it must be
# available in pip's isolated build environment. Pinned to the 3.2.x
# line because that's what generated the committed auth/iam/middleware/
# policy *.c sources (verified reproducible); 3.3.0 produces a large,
# unverified diff and must not be adopted silently (see README's build
# section before bumping this).
requires = ["setuptools>=68", "wheel", "Cython>=3.2,<3.3"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibioai-security-sdk"
version = "0.1.0"
description = "Zero-trust security SDK for OmniBioAI ecosystem"
requires-python = ">=3.10"

dependencies = [
    "httpx",
    "redis",
    "pyjwt",
    "starlette"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pyflakes + pycodestyle errors only; the explicit selection keeps CI stable
# when a new ruff release changes its default rule set.
select = ["E", "F"]
