name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install the runtime dependencies declared in pyproject.toml rather
      # than the package itself: setup.py compiles the Cython extensions,
      # and the tests exercise the Python sources from the repository root.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip tomli
          python - > requirements-ci.txt <<'PY'
          import tomli
          with open("pyproject.toml", "rb") as f:
              print("\n".join(tomli.load(f)["project"]["dependencies"]))
          PY
          python -m pip install -r requirements-ci.txt pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  package:
    name: Install & import (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Builds the package (including the Cython extensions declared in
      # setup.py) the way a consumer's `pip install` does.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      # Run outside the checkout so modules resolve from site-packages, not
      # the repository root. middleware.auth and middleware.policy are left
      # out: they import the not-yet-existing omnibioai_security_sdk package
      # (see the package layout note in README.md).
      - name: Import installed modules
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib
          for name in ("auth.service", "iam.client", "iam.cache", "policy.client",
                       "core.config", "core.context", "audit.client", "middleware.s2s"):
              module = importlib.import_module(name)
              print(f"ok {name}: {module.__file__}")
          PY

      # The "test" job above runs pytest against the plain .py sources, so it
      # never exercises the compiled Cython extensions. Build in-place here
      # (.so files shadow .py on import) and run the same suite against the
      # compiled modules, in the checkout, as a behavioral check of the
      # actual shipped artifacts.
      - name: Build extensions in-place
        run: |
          python -m pip install "Cython>=3.2,<3.3" pytest pytest-asyncio httpx redis pyjwt starlette
          python setup.py build_ext --inplace

      - name: Test against compiled extensions
        run: pytest -q
